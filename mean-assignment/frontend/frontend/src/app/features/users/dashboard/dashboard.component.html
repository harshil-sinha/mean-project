<h2>User Dashboard</h2>

<mat-card *ngIf="stats">
  <p>Total: {{ stats.total }}</p>
</mat-card>

<table
  mat-table
  [dataSource]="users"
>
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef>
      Name
    </th>

    <td mat-cell *matCellDef="let user">
      {{ user.name }}
    </td>
  </ng-container>

  <ng-container matColumnDef="email">
    <th mat-header-cell *matHeaderCellDef>
      Email
    </th>

    <td mat-cell *matCellDef="let user">
      {{ user.email }}
    </td>
  </ng-container>

  <ng-container matColumnDef="role">
    <th mat-header-cell *matHeaderCellDef>
      Role
    </th>

    <td mat-cell *matCellDef="let user">
      {{ user.role }}
    </td>
  </ng-container>

  <ng-container matColumnDef="status">
    <th mat-header-cell *matHeaderCellDef>
      Status
    </th>

    <td mat-cell *matCellDef="let user">
      {{ user.status }}
    </td>
  </ng-container>

  <tr
    mat-header-row
    *matHeaderRowDef="
      displayedColumns
    "
  ></tr>

  <tr
    mat-row
    *matRowDef="
      let row;
      columns: displayedColumns
    "
  ></tr>
</table>
